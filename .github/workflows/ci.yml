name: NeuroCloak Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Pytest & ML Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest mongomock

      - name: Run Backend Pytest Suite
        env:
          JWT_SECRET: "ci-testing-jwt-secret-minimum-32-characters"
          MONGODB_URI: "mongodb://127.0.0.1:27017/neurocloak_test"
          PORT: 5000
          RATELIMIT_STORAGE_URI: "memory://"
        run: |
          python -m pytest tests -v

  frontend-ci:
    name: Frontend Build & Vitest Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Vitest Suite
        run: npm test

      - name: Verify Production Typecheck & Build
        run: npm run build

services:
  # ── REDIS (Internal Cache & Socket Broker) ────────────────────────────────
  - type: redis
    name: neurocloak-redis
    plan: free
    region: oregon # Stable region for free tier
    ipAllowList: [] # Only allow internal traffic

  # ── BACKEND (Python/Flask AI Governance API) ─────────────────────────────
  - type: web
    name: neurocloak-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MONGODB_URI
        sync: false # Set in Render dashboard for security
      - key: REDIS_URL
        fromService:
          type: redis
          name: neurocloak-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://neuro-cloak.vercel.app
